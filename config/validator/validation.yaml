App\Entity\Location:
    properties:
        latitude:
            - Range:
                  min: -90
                  max: 90
                  groups: ['create','edit']
                  notInRangeMessage: 'Wartość musi być z zakresu (-90,90)'
        longitude:
            - Range:
                  min: -180
                  max: 180
                  groups: ['create','edit' ]
                  notInRangeMessage: 'Wartość musi być z zakresu (-180,180)'
        city:
            - NotBlank:
                  groups: ['create','edit']
                  message: 'Wypełnij to pole'

App\Entity\Measurement:
    properties:
        celsius:
            - Range:
                  min: -90
                  max: 60
                  groups: ['create','edit']
                  notInRangeMessage: 'Wartość musi być z zakresu (-90,60)'
        date:
            - LessThanOrEqual:
                  value: 'today'
                  groups: ['create','edit']
                  message: 'Data pomiaru nie może być z przyszłości'
